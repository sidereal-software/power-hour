<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Hour</title>
    <meta
      name="description"
      content="60 songs. 60 random timestamps. 60 minutes. A Spotify power hour that runs entirely in your browser."
    />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>"
    />
    <script>
      // Must exist before the SDK script runs; module scripts are deferred and
      // would register this callback too late.
      window.__sdkReady = new Promise((resolve) => {
        window.onSpotifyWebPlaybackSDKReady = resolve
      })
    </script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
